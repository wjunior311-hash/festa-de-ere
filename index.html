<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organização da Festa de Erê</title><style>:root{font-family:Arial,sans-serif;color:#202020;background:#f4f4f4}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:18px}header,.progress,.notice{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px}h1{margin:0 0 7px;font-size:25px}header p{margin:0;color:#666}.legend{display:flex;gap:14px;margin-top:14px;font-size:13px;color:#555;flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#bdbdbd}.dot.late{background:#d62828}.dot.complete-dot{background:#278a4b}nav{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tab{padding:12px 18px;border:1px solid #ccc;border-radius:10px;background:#fff;font-weight:700;cursor:pointer}.tab.active{background:#222;color:#fff}.bar{height:7px;background:#e8e8e8;border-radius:10px;margin-top:9px;overflow:hidden}.bar span{display:block;height:100%;background:#278a4b;border-radius:inherit}.notice{border-left:4px solid #222;font-size:14px;line-height:1.4}.card{background:#fff;border:2px solid #ddd;border-radius:14px;margin:9px 0;overflow:hidden}.card.done{border-color:#67b77f;background:#f0faf3}.card.overdue{border-color:#e35b5b;background:#fff2f2}.taskhead{width:100%;border:0;background:transparent;padding:16px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:15px;cursor:pointer}.task-main{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}.time{color:#111;background:#ececec;border-radius:8px;padding:5px 9px;font-size:17px;font-weight:800}.card.done .time{background:#d8f0df;color:#1f713d}.card.overdue .time{background:#f7cccc;color:#a71919}.taskhead strong{font-size:16px}.status{font-style:normal;font-size:12px;font-weight:800}.card.done .status{color:#278a4b}.card.overdue .status{color:#c52222}.arrow{font-size:22px;color:#666}.details{display:none;border-top:1px solid #e7e7e7;padding:14px 16px 16px}.details.open{display:block}.steps div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eee;line-height:1.4}.steps div:last-child{border-bottom:0}.steps b{flex:0 0 22px;height:22px;border-radius:50%;background:#e7e7e7;text-align:center;line-height:22px;font-size:12px}.note{margin-top:12px;background:#f1f1f1;padding:11px;border-radius:9px;font-size:13px;line-height:1.4}.complete{margin-top:13px;width:100%;border:1px solid #999;background:#fff;border-radius:9px;padding:12px;font-weight:800;cursor:pointer}.complete.is-done{border-color:#278a4b;color:#278a4b;background:#e8f6ec}@media(max-width:520px){main{padding:12px}h1{font-size:22px}.tab{flex:1}}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://hixlprdsmlmbzsfxvqby.supabase.co';const SUPABASE_KEY='sb_publishable_bVt9gi8esTObSbEew3ZavA_HajtnLMa';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const days={Sexta:[['14h–19h','Montagem das sacolinhas','Conte todos os itens; confira quantos kits serão montados; veja se falta algum item; separe tudo para a montagem dos saquinhos.'],['14h–15h','Geladeira','Libere espaço; encha garrafas para fazer gelo; deixe espaço para bolos e sobremesas; separe o isopor das bebidas.'],['15h–16h','Organizar e limpar cozinha','Organize o espaço interno; coloque a prateleira; defina os espaços para bolos e sobremesas; lave, seque e guarde o que estiver fora do lugar.'],['15h–16h','Verificar afazeres de decoração','Confira o que está pronto; veja o que falta; separe os materiais para sábado.'],['16h–17h','Arrumar lavanderia / espaços de apoio','Guarde o que estiver fora do lugar; limpe e deixe o espaço livre.'],['16h–17h','Separar tecidos coloridos','Separe os tecidos; confira o estado deles; deixe tudo junto para a decoração.'],['17h–18h','Verificar necessidade de lona','Confira se a lona será necessária; veja tamanho e condições; deixe separada se for usar.','Se for necessário colocar a lona, as tarefas serão remanejadas entre as pessoas presentes.'],['Durante a sexta','Lavar alguidars','Recolha os alguidars que estiverem sujos; lave; enxágue; deixe limpos e organizados no local correto.']],Sábado:[['10h–12h','Decoração geral','Coloque os materiais; organize cada espaço; confira a decoração; guarde o que não será usado.'],['10h–11h','Organizar descartáveis e lixeiras','Conte os descartáveis; separe por finalidade; organize; distribua as lixeiras; coloque sacos.','Durante a gira, verificar as lixeiras e trocar os sacos quando estiverem cheios.'],['10h–11h','Arrumar banheiro','Limpe vaso, pia e chão; retire o lixo; reponha papel, sabonete e outros itens necessários.'],['10h–11h30','Colocar cadeiras e bancos','Coloque nos lugares; limpe; confira se há peças quebradas; conte os lugares disponíveis.'],['10h–11h30','Preparar acaça','Prepare e coloque no recipiente adequado; deixe em local apropriado para resfriar.','Precisa terminar cedo para dar tempo de resfriar antes da gira.'],['11h30–12h30','Padês e quartinhas','Separe os materiais; prepare e organize; posicione conforme orientação da casa.'],['12h–13h','Organização dos itens da gira','Confira todos os itens; separe; coloque cada item no lugar definido; confira novamente.'],['12h–14h','Organizar mesas e espaços de convivência','Mesa de apoio para Atabaque;Mesa de doces dos Erês;Mesa de café e água da assistência;Mesa de doces da assistência;Mesa de kits de doces;Mesa para nomes;Mesa de amaci e pipoca;Mesa de mojuba e figueira'],['13h–14h','Firmeza da casa','Separe o necessário e realize conforme orientação dos responsáveis da casa.'],['13h30–14h30','Preparo da defumação','Separe os materiais; prepare conforme orientação da casa; deixe pronta para uso.'],['14h–15h','Apoio na chegada — pipoca e amaci','Organize a chegada; apoie a organização da pipoca e do amaci; ajude quem precisar.'],['14h30–15h30','Conferência final','Confira decoração, mesas, cozinha, banheiro, itens da gira, acaça, descartáveis e lixeiras.','Todas as tarefas de sábado devem estar prontas entre 14h30 e 15h30. A gira começa às 16h.'],['Pós-gira','Retirar itens sujos e separar por categoria','Recolha os itens usados; separe panos, alguidars, utensílios e outras categorias; encaminhe cada grupo para lavagem ou guarda; recolha bitucas de cigarro e outros itens deixados por você.'],['Pós-gira','Lavar alguidars','Recolha; lave; enxágue; deixe limpos e organizados no local correto.'],['Pós-gira','Lavar louça','Recolha; lave; seque; guarde; deixe a cozinha organizada.'],['Pós-gira','Varrer quintal','Recolha sujeiras maiores; varra; junte o lixo e coloque no local correto.'],['Pós-gira','Varrer parte de cima','Recolha sujeiras; varra toda a área; junte o lixo e descarte corretamente.'],['Pós-gira','Varrer cozinha','Recolha resíduos; varra o chão; junte o lixo; deixe o piso limpo.'],['Pós-gira','Lavar banheiro','Retire o lixo; lave vaso e pia; limpe o chão; reponha os itens necessários.'],['Pós-gira','Retirar decoração','Retire os elementos; separe os materiais reutilizáveis; deixe tudo pronto para guardar.'],['Pós-gira','Organizar decoração para guarda','Separe por categoria; dobre e guarde tecidos; organize potes e materiais; guarde no local correto.']],Domingo:[['10h–11h','Lavar banheiro','Retire o lixo; lave vaso e pia; limpe espelho e superfícies; lave o chão; reponha os itens necessários.'],['11h–13h','Organização dos espaços + guardar itens fora do lugar','Percorra todos os espaços; identifique o que está fora do lugar; separe por local de destino; guarde cada item; organize os espaços; faça uma última conferência.']]};
let selected='Sexta',done={};const LOCAL_KEY='festa-ere-task-status-v1';function readLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}')}catch{return {}}}function writeLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(done))}catch{}}
function key(i){return selected+'-'+i}function end(t){if(!t.includes('–'))return null;const x=t.split('–')[1].match(/^(\d{1,2})h(?:([0-5]\d))?$/);return x?Number(x[1])*60+Number(x[2]||0):null}function late(t){if(selected==='Sábado'&&t==='Pós-gira')return false;const d=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][new Date().getDay()],e=end(t);return d===selected&&e!==null&&(new Date().getHours()*60+new Date().getMinutes()>=e)}
async function load(){const local=readLocal();const {data,error}=await db.from('task_status').select('task_id,done');if(!error)done=Object.fromEntries(data.map(x=>[x.task_id,x.done]));done={...local,...done};render()}
async function toggle(i){const k=key(i),b=!done[k];done[k]=b;render();let error=null;try{const rpc=await db.rpc('set_task_status',{p_task_id:k,p_done:b});error=rpc.error}catch(e){error=e}if(error){const r=await db.from('task_status').upsert({task_id:k,done:b},{onConflict:'task_id'});error=r.error}if(error){writeLocal();render();alert('A tarefa foi salva neste aparelho, mas não foi possível sincronizar com o servidor. Tente novamente em instantes.')}else{delete readLocal()[k];writeLocal();await load()}}
function render(){const ts=days[selected],count=ts.filter((_,i)=>done[key(i)]).length;document.querySelector('#app').innerHTML='<main><header><h1>Organização da Festa de Erê</h1><p>Toque em uma tarefa para ver o passo a passo.</p><div class="legend"><span><i class="dot"></i> Pendente</span><span><i class="dot late"></i> Atrasada</span><span><i class="dot complete-dot"></i> Concluída</span></div></header><nav>'+Object.keys(days).map(d=>'<button class="tab '+(d===selected?'active':'')+'" onclick="selected=\''+d+'\';render()">'+d+'</button>').join('')+'</nav><section class="progress"><strong>'+count+' de '+ts.length+' tarefas concluídas</strong><div class="bar"><span style="width:'+Math.round(count/ts.length*100)+'%"></span></div></section><section class="notice">As tarefas de sábado devem estar prontas entre 14h30 e 15h30. A gira começa às 16h.</section>'+ts.map((t,i)=>{const k=key(i),c=!!done[k],l=!c&&late(t[0]);return '<article class="card '+(c?'done':l?'overdue':'')+'"><button class="taskhead" onclick="this.nextElementSibling.classList.toggle(\'open\');this.querySelector(\'.arrow\').textContent=this.nextElementSibling.classList.contains(\'open\')?\'−\':\'+\'"><span class="task-main"><small class="time">'+t[0]+'</small><strong>'+t[1]+'</strong>'+(c?'<em class="status">Concluída</em>':l?'<em class="status">Atrasada</em>':'')+'</span><span class="arrow">+</span></button><div class="details"><div class="steps">'+t[2].split(';').map((s,n)=>'<div><b>'+(n+1)+'</b><span>'+s.trim()+'</span></div>').join('')+'</div>'+(t[3]?'<div class="note">'+t[3]+'</div>':'')+'<button class="complete '+(c?'is-done':'')+'" onclick="toggle('+i+')">'+(c?'Marcar como pendente':'Marcar como concluída')+'</button></div></article>'}).join('')+'</main>'}
db.channel('task-status-realtime').on('postgres_changes',{event:'*',schema:'public',table:'task_status'},()=>load()).subscribe();load();
</script></body></html>
